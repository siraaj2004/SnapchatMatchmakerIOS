name: Matchmaker
options:
  bundleIdPrefix: com.shaik
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Matchmaker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Models
      - path: Views
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaik.matchmaker
        PRODUCT_NAME: Matchmaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    scheme:
      testTargets: [MatchmakerTests]
  MatchmakerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Matchmaker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shaik.matchmaker.tests
        GENERATE_INFOPLIST_FILE: "YES"
